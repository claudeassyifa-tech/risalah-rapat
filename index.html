<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risalah Rapat — Assyifa Tour and Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --paper:#F7EEDD; --card:#FFFFFF;
    --ink:#2A1A1F; --ink-soft:#6B5A5E; --ink-faint:#9C8B8F;
    --navy:#7A1B32; --navy-dark:#551224;
    --gold:#A67C3D; --gold-light:#F3E7D3;
    --line:#E3D3B8; --line-soft:#EDE1C8;
    --topik-c:#A13B55; --topik-bg:#F7E3E8;
    --tindak:#B45309; --tindak-bg:#FCEEDD;
    --ide:#0F766E; --ide-bg:#E1F3EE;
    --pengingat:#A3195B; --pengingat-bg:#FBE6EE;
    --netral:#52606D; --netral-bg:#ECEEF0;
    --danger:#B91C1C; --danger-bg:#FBEAEA;
    --font-display:'Source Serif 4', Georgia, serif;
    --font-sans:'Plus Jakarta Sans', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
  #app{max-width:960px;margin:0 auto;padding:0 20px 80px;}

  .topbar{background:var(--navy);color:var(--paper);margin:0 -20px 24px;padding:22px 24px;}
  .topbar-inner{max-width:920px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo{width:44px;height:44px;border-radius:50%;background:#fff;object-fit:contain;flex-shrink:0;}
  .brand h1{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0;letter-spacing:0.2px;}
  .brand p{margin:2px 0 0;font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#B9C6D6;}
  .btn{font-family:var(--font-sans);font-weight:600;font-size:13.5px;border-radius:6px;padding:10px 16px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s;}
  .btn:hover{opacity:0.85;}
  .btn-gold{background:var(--gold);color:#2B1E0F;border-color:var(--gold);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--line);}
  .btn-outline{background:transparent;color:var(--paper);border-color:#B5677A;}
  .btn-outline:hover{background:rgba(255,255,255,0.08);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
  .stat-card .num{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--navy);line-height:1;}
  .stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .stat-card.warn .num{color:var(--tindak);}
  .stat-card.ide-c .num{color:var(--ide);}

  .attention-banner{background:#FFFDF7;border:1px solid var(--gold);border-radius:10px;margin-bottom:20px;overflow:hidden;}
  .attention-head{padding:13px 18px;background:var(--gold-light);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;color:#5B3F1B;}
  .attention-list{padding:6px 12px;}
  .attention-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid var(--line-soft);}
  .attention-item:last-child{border-bottom:none;}
  .attention-left{flex:1;min-width:0;}
  .attention-uraian{font-size:13.5px;color:var(--ink);margin:0 0 3px;}
  .attention-meta{font-size:11.5px;color:var(--ink-faint);}
  .attention-meta .src{color:var(--navy);cursor:pointer;text-decoration:underline;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;min-width:220px;max-width:340px;}
  .search-wrap input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:6px;font-family:var(--font-sans);font-size:13.5px;background:var(--card);color:var(--ink);}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:0.5;}

  .register{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;padding:12px 14px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--line);background:#F5F2EA;}
  tbody td{padding:13px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBFAF6;}
  .nomor-chip{font-family:var(--font-mono);font-size:11.5px;color:var(--navy);background:var(--gold-light);border:1px dashed var(--gold);border-radius:4px;padding:3px 7px;display:inline-block;white-space:nowrap;}
  .jenis-tag{font-size:11px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:0.4px;}
  .topik-cell{display:flex;flex-wrap:wrap;gap:4px;}
  .topik-chip-sm{background:var(--topik-bg);color:var(--topik-c);font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;}
  .ket-txt{color:var(--ink-soft);font-size:12px;margin-top:3px;}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .icon-btn{border:1px solid var(--line);background:var(--card);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);}
  .icon-btn:hover{background:#F5F2EA;color:var(--ink);}
  .icon-btn.danger:hover{background:var(--danger-bg);color:var(--danger);border-color:#EBC5C5;}

  .empty-state{padding:60px 24px;text-align:center;color:var(--ink-soft);}
  .empty-state h3{font-family:var(--font-display);font-size:19px;color:var(--ink);margin:0 0 6px;}
  .empty-state p{font-size:13.5px;margin:0 0 18px;}

  .form-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .form-header .back-link{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13.5px;cursor:pointer;font-weight:600;}
  .form-header .actions{display:flex;gap:8px;}

  .section-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:18px;}
  .section-title{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin:0 0 16px;font-weight:600;border-bottom:1px solid var(--line-soft);padding-bottom:10px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;font-family:var(--font-sans);font-size:13.5px;color:var(--ink);background:var(--paper);}
  .field textarea{resize:none;min-height:44px;overflow:hidden;font-family:var(--font-sans);line-height:1.5;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid #C9D9EC;border-color:var(--navy);}
  .nomor-display{font-family:var(--font-mono);font-size:14px;color:var(--navy);background:var(--gold-light);border:1px dashed var(--gold);border-radius:6px;padding:9px 11px;display:flex;align-items:center;justify-content:space-between;}
  .nomor-display button{background:none;border:none;color:var(--navy);cursor:pointer;font-size:12px;text-decoration:underline;font-family:var(--font-sans);}

  .tag-input-box{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);}
  .tag-chip{background:var(--netral-bg);color:var(--netral);border-radius:5px;padding:4px 8px;font-size:12.5px;display:flex;align-items:center;gap:6px;font-weight:600;}
  .tag-chip button{background:none;border:none;color:inherit;cursor:pointer;padding:0;display:flex;font-size:14px;line-height:1;}
  .tag-input-box input{flex:1;min-width:120px;border:none;background:none;font-size:13.5px;padding:4px;font-family:var(--font-sans);color:var(--ink);}
  .tag-input-box input:focus{outline:none;}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px;}
  .suggest-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .suggest-row button{background:var(--card);border:1px solid var(--line);color:var(--ink-soft);font-size:12px;padding:4px 9px;border-radius:20px;cursor:pointer;font-family:var(--font-sans);}
  .suggest-row button:hover{background:var(--topik-bg);color:var(--topik-c);border-color:var(--topik-c);}

  .metric-group-card{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:14px 16px;margin-bottom:14px;background:var(--paper);}
  .metric-group-header{display:flex;gap:10px;align-items:center;margin-bottom:12px;}
  .metric-group-header select{flex:1;max-width:320px;padding:8px 9px;border:1px solid var(--line);border-radius:6px;font-family:var(--font-sans);font-size:13.5px;font-weight:700;color:var(--navy);background:var(--card);}
  .metric-row{display:grid;grid-template-columns:1.1fr 0.55fr 0.55fr 0.65fr 0.85fr 1.1fr 28px;gap:6px;align-items:start;margin-bottom:8px;}
  .metric-row select, .metric-row input{padding:7px 7px;border:1px solid var(--line);border-radius:6px;font-family:var(--font-sans);font-size:12px;color:var(--ink);background:var(--card);width:100%;}
  .metric-row input[type=number]{text-align:right;font-family:var(--font-mono);font-weight:600;}
  .metric-row .icon-btn{align-self:center;width:26px;height:26px;}
  .metric-header-row{display:grid;grid-template-columns:1.1fr 0.55fr 0.55fr 0.65fr 0.85fr 1.1fr 28px;gap:6px;margin-bottom:6px;}
  .metric-header-row span{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--ink-faint);}
  .add-metric-row-btn{background:none;border:none;color:var(--navy);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 0;text-decoration:underline;}
  .metric-group-delete{margin-left:auto;}
  .status-select-proses{color:var(--tindak);}
  .status-select-reminder{color:var(--pengingat);}
  .status-select-selesai{color:#047857;}

  .block-card{border:1px solid var(--line);border-left:4px solid var(--netral);border-radius:8px;padding:16px 18px;margin-bottom:14px;background:var(--paper);}
  .block-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .block-judul-input{font-size:14.5px;font-weight:700;font-family:var(--font-sans);border:none;background:none;padding:4px 0;width:100%;color:var(--ink);border-bottom:1px dashed var(--line);}
  .block-judul-input:focus{outline:none;border-bottom-color:var(--navy);}
  .block-judul-input::placeholder{font-weight:500;color:var(--ink-faint);}
  .block-timestamp{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;padding-top:6px;}
  .richtext-toolbar{display:flex;gap:4px;margin-bottom:6px;}
  .rt-btn{border:1px solid var(--line);background:var(--card);border-radius:5px;min-width:30px;height:28px;padding:0 8px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-sans);}
  .rt-btn:hover{background:#F5F2EA;color:var(--ink);}
  .block-isi{min-height:60px;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--font-sans);font-size:13.5px;line-height:1.55;color:var(--ink);}
  .block-isi:focus{outline:2px solid #C9D9EC;border-color:var(--navy);}
  .block-isi ol, .block-isi ul{margin:4px 0 4px 22px;padding:0;}
  .block-isi li{margin-bottom:2px;}
  .block-isi:empty:before{content:attr(data-placeholder);color:var(--ink-faint);}

  .no-blocks, .no-metrics, .no-ide, .no-todos{color:var(--ink-faint);font-size:13px;text-align:center;padding:20px;border:1px dashed var(--line);border-radius:8px;margin-bottom:10px;}
  .add-block-btn, .add-metric-btn, .add-ide-btn, .add-todo-btn{width:100%;padding:11px;border:1.5px dashed var(--gold);border-radius:8px;background:var(--gold-light);color:var(--navy);font-weight:600;font-size:13.5px;cursor:pointer;}
  .add-block-btn:hover, .add-metric-btn:hover, .add-ide-btn:hover, .add-todo-btn:hover{background:#EDDDC0;}

  .ide-card{border:1px solid var(--line);border-left:4px solid var(--ide);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:var(--paper);}
  .ide-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}

  .todo-card{border:1px solid var(--line);border-left:4px solid var(--tindak);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:var(--paper);}
  .todo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}

  .form-footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap;gap:10px;}
  .save-status{font-size:12px;color:var(--ink-faint);}
  select option{font-family:var(--font-sans);}
  .status-pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;}
  .status-belum{background:#FBEAEA;color:#B91C1C;}
  .status-berjalan{background:#FCEEDD;color:#B45309;}
  .status-selesai{background:#E1F3EA;color:#047857;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:3px 8px;border-radius:4px;}
  .badge-todo{background:var(--tindak-bg);color:var(--tindak);}
  .optional-tag{font-size:11px;color:var(--ink-faint);font-weight:400;text-transform:none;letter-spacing:0;}

  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;top:0;left:0;width:100%;padding:0;}
    .no-print{display:none !important;}
  }
  .doc-page{max-width:720px;margin:0 auto;font-family:var(--font-sans);color:#111;}
  .doc-header-logo{display:flex;justify-content:center;margin-bottom:8px;}
  .doc-header-logo img{width:64px;height:64px;border-radius:50%;}
  .doc-title{font-family:var(--font-display);font-size:22px;font-weight:700;text-align:center;letter-spacing:1px;margin:0 0 2px;text-transform:uppercase;}
  .doc-subtitle{text-align:center;font-size:13px;color:#444;margin:0 0 18px;}
  .doc-meta-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:20px;}
  .doc-meta-table td{padding:3px 0;vertical-align:top;}
  .doc-meta-table td.k{width:130px;color:#555;}
  .doc-meta-table td.sep{width:14px;}
  .doc-section-h{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1.5px solid #222;padding-bottom:4px;margin:22px 0 12px;}
  .doc-block{margin-bottom:16px;padding-left:2px;}
  .doc-block-head{display:flex;gap:8px;align-items:baseline;font-size:13px;font-weight:700;margin-bottom:3px;flex-wrap:wrap;}
  .doc-block-body{font-size:12.5px;line-height:1.55;margin:4px 0 0;}
  .doc-block-body ol, .doc-block-body ul{margin:4px 0 4px 22px;padding:0;}
  .doc-block-body li{margin-bottom:2px;}
  .doc-block-time{font-size:10px;color:#999;margin-top:3px;}
  .doc-next{font-size:12.5px;line-height:1.6;background:#F7F5EF;border:1px solid #ddd;border-radius:6px;padding:12px 14px;}
  .doc-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:10px;}
  .doc-table th{text-align:left;padding:4px 8px 4px 0;border-bottom:1px solid #999;font-size:10px;text-transform:uppercase;}
  .doc-table td{padding:4px 8px 4px 0;border-bottom:1px solid #eee;vertical-align:top;}
  .doc-sign{display:flex;justify-content:space-between;margin-top:50px;font-size:12.5px;}
  .doc-sign-block{width:44%;text-align:center;}
  .doc-sign-space{height:64px;}
  .doc-footer-note{margin-top:30px;font-size:10.5px;color:#999;text-align:right;}
</style>
</head>
<body>
<div id="app"></div>
<div id="print-area"></div>

<script>
(function(){

var STORAGE_KEY = "meetings_v3";
var SETTINGS_KEY = "settings_v3";
var state = {
  view: "list",
  meetings: [],
  settings: {
    prefix: "RR",
    jenisOptions: ["Briefing Today","Rapat Pekanan","Rapat Umum","Rapat Tim Operasional","Rapat Tim Marketing"],
    topikSuggestions: ["Persiapan Manasik","Persiapan Keberangkatan","Persiapan Penjemputan","Informasi Umum","Strategi","Laporan","Evaluasi Kegiatan"],
    indikatorSuggestions: ["Telepon","Follow Up","Closing","Kunjungan","Booking","Pembayaran Lunas"]
  },
  editing: null,
  searchQuery: "",
  loaded: false,
  loadError: null
};

var ROMAWI = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
var HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var STAFF_LIST = ["Teguh Muhammad Firdaus","Agus Purwanto","Cepi Sutanto","Muhamad Arif Basuni","Azhar Dzaky Muhamad","Fithri Amalia Rahma","Nabila Azahra","Andy Rohaendy","Zenal Ali Mansur","Dedi","Indri"];
var STATUS_TODO_LABEL = { belum:"Belum dikerjakan", berjalan:"Sedang berjalan", selesai:"Selesai" };
var STATUS_KINERJA_LABEL = { proses:"Proses", reminder:"Reminder", selesai:"Selesai" };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function formatTanggalPanjang(iso){ if(!iso) return "-"; var d=new Date(iso+"T00:00:00"); return HARI[d.getDay()]+", "+d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear(); }
function formatTanggalPendek(iso){ if(!iso) return "-"; var d=new Date(iso+"T00:00:00"); return d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear(); }
function formatTimestamp(iso){ var d=new Date(iso); return d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear()+", "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toDisplayHtml(isi){
  if(!isi) return "";
  if(isi.indexOf('<') === -1){ return esc(isi).replace(/\n/g,'<br>'); }
  return isi;

    indikator: r.indikator || "",
    target: r.target!=null ? r.target : "",
    progress: r.progress!=null ? r.progress : (r.terealisasi!=null ? r.terealisasi : ""),
    hasil: r.hasil || "",
    status: r.status || "proses",
    catatan: r.catatan || ""
  };
}
function normalizeMetricGroups(raw){
  if(!raw || !raw.length) return [];
  if(raw[0] && Array.isArray(raw[0].rows)){
    return raw.map(function(g){ return { id: g.id||uid(), staff: g.staff||"", rows: (g.rows||[]).map(normalizeMetricRow) }; });
  }
  var groups = [];
  var byStaff = {};
  raw.forEach(function(item){
    var staffName = item.staff || "";
    if(!byStaff[staffName]){
      var g = { id: uid(), staff: staffName, rows: [] };
      byStaff[staffName] = g;
      groups.push(g);
    }
    byStaff[staffName].rows.push(normalizeMetricRow({ indikator: item.indikator, terealisasi: item.angka, catatan: item.catatan }));
  });
  return groups;
}
function migrateBlocksAndTodos(rawBlocks, existingTodos){
  var todos = (existingTodos || []).slice();
  var cleanBlocks = (rawBlocks||[]).map(function(b){
    if(b.penanda === "tindak_lanjut" || b.penanda === "pengingat"){
      todos.push({
        id: b.id || uid(), judul: b.judul || "", deskripsi: b.isi || "", pic: b.pic || "",
        tenggat: b.tenggat || "",
        status: b.penanda === "pengingat" ? (b.status === "selesai" ? "selesai" : "belum") : (b.status || "belum"),
        timestamp: b.timestamp || new Date().toISOString()
      });
    }
    return { id: b.id || uid(), judul: b.judul || "", isi: b.isi || "", timestamp: b.timestamp || new Date().toISOString() };
  });
  return { blocks: cleanBlocks, todos: todos };
}
function rowToMeeting(row){
  var migrated = migrateBlocksAndTodos(row.blocks || [], row.todos || []);
  return {
    id: row.id, nomor: row.nomor, tanggal: row.tanggal, jenisRapat: row.jenis_rapat,
    topik: row.topik || [], keterangan: row.keterangan || "", pimpinan: row.pimpinan || "", notulen: row.notulen || "",
    peserta: row.peserta || [], blocks: migrated.blocks, metrics: normalizeMetricGroups(row.metrics || []),
    ide: row.ide || [], todos: migrated.todos, rencana: row.rencana || { tanggal:"", topik:"", catatan:"" },
    createdAt: row.created_at, updatedAt: row.updated_at
  };
}
function meetingToRow(m){
  return {
    id: m.id, nomor: m.nomor, tanggal: m.tanggal, jenis_rapat: m.jenisRapat,
    topik: m.topik||[], keterangan: m.keterangan||"", pimpinan: m.pimpinan||"", notulen: m.notulen||"",
    peserta: m.peserta||[], blocks: m.blocks||[], metrics: m.metrics||[], ide: m.ide||[], todos: m.todos||[],
    rencana: m.rencana||{}, updated_at: new Date().toISOString()
  };
}

async function loadData(){
  if(!SUPABASE_CONFIGURED){ state.loaded = true; render(); return; }
  state.loadError = null;
  try{
    var r1 = await supabaseClient.from('meetings').select('*').order('tanggal', { ascending:false });
    if(r1.error) throw r1.error;
    state.meetings = (r1.data||[]).map(rowToMeeting);

    var r2 = await supabaseClient.from('app_settings').select('*').eq('id','default').maybeSingle();
    if(r2.error) throw r2.error;
    if(r2.data){
      state.settings = {
        prefix: r2.data.prefix || "RR",
        jenisOptions: r2.data.jenis_options || state.settings.jenisOptions,
        topikSuggestions: r2.data.topik_suggestions || state.settings.topikSuggestions,
        indikatorSuggestions: r2.data.indikator_suggestions || state.settings.indikatorSuggestions
      };
    } else {
      await supabaseClient.from('app_settings').upsert({ id:'default', prefix: state.settings.prefix, jenis_options: state.settings.jenisOptions, topik_suggestions: state.settings.topikSuggestions, indikator_suggestions: state.settings.indikatorSuggestions });
    }
  }catch(e){
    console.error("Gagal memuat data dari Supabase", e);
    state.loadError = "Tidak bisa terhubung ke database. Periksa Project URL / anon key di bagian atas kode, koneksi internet, dan pastikan skrip SQL sudah dijalankan di Supabase (termasuk update kolom ide/todos).";
  }
  state.loaded = true;
  render();
}
async function saveMeetingRow(m){
  try{
    var r = await supabaseClient.from('meetings').upsert(meetingToRow(m));
    if(r.error) throw r.error;
  }catch(e){
    console.error("Gagal menyimpan rapat ke database", e);
    alert("Gagal menyimpan ke database. Periksa koneksi internet kamu, lalu coba simpan lagi.");
  }
}
async function deleteMeetingRow(id){
  try{
    var r = await supabaseClient.from('meetings').delete().eq('id', id);
    if(r.error) throw r.error;
  }catch(e){
    console.error("Gagal menghapus rapat dari database", e);
    alert("Gagal menghapus dari database. Coba lagi.");
  }
}
async function saveSettingsRow(){
  try{
    var r = await supabaseClient.from('app_settings').upsert({ id:'default', prefix: state.settings.prefix, jenis_options: state.settings.jenisOptions, topik_suggestions: state.settings.topikSuggestions, indikator_suggestions: state.settings.indikatorSuggestions });
    if(r.error) throw r.error;
  }catch(e){ console.error("Gagal menyimpan pengaturan", e); }
}
function exportData(){
  var payload = { app: "risalah-rapat-att", exportedAt: new Date().toISOString(), meetings: state.meetings, settings: state.settings };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "backup-risalah-rapat-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importDataFromFile(file){
  var reader = new FileReader();
  reader.onload = async function(e){
    var data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ alert("Gagal membaca file. Pastikan ini file backup JSON yang valid."); return; }
    if(!data || !Array.isArray(data.meetings)){ alert("File backup tidak valid atau bukan dari sistem ini."); return; }
    if(!confirm("Impor akan MENGGANTI seluruh data rapat di database dengan isi file backup (" + data.meetings.length + " rapat). Proses bisa makan waktu beberapa detik. Lanjutkan?")) return;
    try{
      var existingIds = state.meetings.map(function(m){return m.id;});
      for(var i=0;i<existingIds.length;i++){ await deleteMeetingRow(existingIds[i]); }
      for(var j=0;j<data.meetings.length;j++){ await saveMeetingRow(data.meetings[j]); }
      if(data.settings){ state.settings = data.settings; await saveSettingsRow(); }
      await loadData();
      alert("Data berhasil diimpor: " + data.meetings.length + " rapat.");
    }catch(err){
      console.error(err);
      alert("Terjadi kesalahan saat mengimpor. Sebagian data mungkin sudah masuk — cek daftar rapat.");
      await loadData();
    }
  };
  reader.readAsText(file);
}

function generateNomor(tanggalIso, excludeId){
  if(!tanggalIso) tanggalIso = new Date().toISOString().slice(0,10);
  var d = new Date(tanggalIso + "T00:00:00");
  var tahun = d.getFullYear();
  var bulanRomawi = ROMAWI[d.getMonth()];
  var count = state.meetings.filter(function(m){
    if(m.id === excludeId) return false;
    if(!m.tanggal) return false;
    var md = new Date(m.tanggal + "T00:00:00");
    return md.getFullYear() === tahun && md.getMonth() === d.getMonth();
  }).length;
  var urutan = String(count + 1).padStart(3,"0");
  return state.settings.prefix + "/" + tahun + "/" + bulanRomawi + "/" + urutan;
}

function getOpenTodos(excludeMeetingId){
  var items = [];
  state.meetings.forEach(function(m){
    if(m.id === excludeMeetingId) return;
    (m.todos||[]).forEach(function(t){
      if(t.status !== "selesai"){
        items.push({ todoId: t.id, meetingId: m.id, meetingNomor: m.nomor, meetingTanggal: m.tanggal, judul: t.judul, deskripsi: t.deskripsi, pic: t.pic, tenggat: t.tenggat, status: t.status });
      }
    });
  });
  items.sort(function(a,b){ return (a.meetingTanggal||"").localeCompare(b.meetingTanggal||""); });
  return items;
}
async function markTodoDone(meetingId, todoId){
  var m = state.meetings.find(function(x){return x.id===meetingId;});
  if(!m) return;
  var t = (m.todos||[]).find(function(x){return x.id===todoId;});
  if(!t) return;
  t.status = "selesai";
  render();
  await saveMeetingRow(m);
}

function blankMeeting(){
  var today = new Date().toISOString().slice(0,10);
  return {
    id: uid(), nomor: generateNomor(today, null), tanggal: today,
    jenisRapat: state.settings.jenisOptions[0] || "Rapat Umum",
    topik: [], keterangan: "", pimpinan: "", notulen: "", peserta: [],
    blocks: [], metrics: [], ide: [], todos: [], rencana: { tanggal:"", topik:"", catatan:"" },
    isNew: true, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString()
  };
}
function openNew(){ state.editing = blankMeeting(); state.view = "form"; render(); }
function openEdit(id){
  var m = state.meetings.find(function(x){return x.id===id;});
  if(!m) return;
  state.editing = JSON.parse(JSON.stringify(m));
  if(!state.editing.rencana) state.editing.rencana = { tanggal:"", topik:"", catatan:"" };
  if(!state.editing.topik) state.editing.topik = [];
  if(!state.editing.metrics) state.editing.metrics = [];
  if(!state.editing.ide) state.editing.ide = [];
  if(!state.editing.todos) state.editing.todos = [];
  state.editing.isNew = false;
  state.view = "form"; render();
}
function backToList(){ state.editing = null; state.view = "list"; render(); }
async function deleteMeeting(id){
  if(!confirm("Hapus risalah rapat ini? Tindakan ini tidak bisa dibatalkan.")) return;
  await deleteMeetingRow(id);
  state.meetings = state.meetings.filter(function(m){return m.id!==id;});
  render();
}
async function saveEditing(){
  if(!state.editing.tanggal){ alert("Tanggal rapat wajib diisi."); return; }
  if(!state.editing.jenisRapat){ alert("Jenis rapat wajib diisi."); return; }
  state.editing.updatedAt = new Date().toISOString();
  var idx = state.meetings.findIndex(function(m){return m.id===state.editing.id;});
  var toSave = JSON.parse(JSON.stringify(state.editing));
  delete toSave.isNew;
  var statusEl = document.getElementById("save-status-el");
  if(statusEl){ statusEl.textContent = "Menyimpan..."; }
  await saveMeetingRow(toSave);
  if(idx >= 0){ state.meetings[idx] = toSave; } else { state.meetings.unshift(toSave); }
  state.editing = toSave; state.editing.isNew = false;
  render();
  var status2 = document.getElementById("save-status-el");
  if(status2){ status2.textContent = "Tersimpan " + formatTimestamp(new Date().toISOString()); }
}

function bindListEvents(){
  var btnNew = document.getElementById("btn-new"); if(btnNew) btnNew.onclick = openNew;
  var btnNewEmpty = document.getElementById("btn-new-empty"); if(btnNewEmpty) btnNewEmpty.onclick = openNew;
  var btnExport = document.getElementById("btn-export"); if(btnExport) btnExport.onclick = exportData;
  var btnImport = document.getElementById("btn-import");
  var importInput = document.getElementById("import-file-input");
  if(btnImport && importInput){
    btnImport.onclick = function(){ importInput.click(); };
    importInput.onchange = function(e){ var f = e.target.files[0]; if(f) importDataFromFile(f); e.target.value = ""; };
  }
  var searchInput = document.getElementById("search-input");
  if(searchInput){
    searchInput.oninput = function(e){
      state.searchQuery = e.target.value;
      var caret = e.target.selectionStart;
      render();
      var el = document.getElementById("search-input");
      if(el){ el.focus(); el.setSelectionRange(caret, caret); }
    };
  }
  document.querySelectorAll(".btn-view").forEach(function(b){ b.onclick = function(){ openEdit(b.getAttribute("data-id")); }; });
  document.querySelectorAll(".btn-del").forEach(function(b){ b.onclick = function(){ deleteMeeting(b.getAttribute("data-id")); }; });
  document.querySelectorAll(".btn-print").forEach(function(b){ b.onclick = function(){ printMeeting(b.getAttribute("data-id")); }; });
  document.querySelectorAll(".btn-mark-done").forEach(function(b){ b.onclick = function(){ markTodoDone(b.getAttribute("data-meeting"), b.getAttribute("data-todo")); }; });
  document.querySelectorAll(".src[data-goto]").forEach(function(el){ el.onclick = function(){ openEdit(el.getAttribute("data-goto")); }; });
}

function bindFormEvents(){
  var m = state.editing;
  document.getElementById("btn-back").onclick = backToList;
  document.getElementById("btn-save").onclick = saveEditing;
  document.getElementById("btn-save-2").onclick = saveEditing;
  var btnPrintForm = document.getElementById("btn-print-form");
  if(btnPrintForm) btnPrintForm.onclick = function(){ printMeeting(m.id); };
  document.querySelectorAll(".btn-mark-done").forEach(function(b){ b.onclick = function(){ markTodoDone(b.getAttribute("data-meeting"), b.getAttribute("data-todo")); }; });
  document.querySelectorAll(".src[data-goto]").forEach(function(el){ el.onclick = function(){ openEdit(el.getAttribute("data-goto")); }; });

  document.getElementById("f-tanggal").onchange = function(e){ m.tanggal = e.target.value; };
  document.getElementById("f-jenis").onchange = function(e){
    if(e.target.value === "__add__"){
      var v = prompt("Nama jenis rapat baru:");
      if(v && v.trim()){ state.settings.jenisOptions.push(v.trim()); saveSettingsRow(); m.jenisRapat = v.trim(); render(); }
      else { e.target.value = m.jenisRapat; }
    } else { m.jenisRapat = e.target.value; }
  };
  document.getElementById("f-keterangan").oninput = function(e){ m.keterangan = e.target.value; };
  document.getElementById("f-rencana-tanggal").onchange = function(e){ m.rencana.tanggal = e.target.value; };
  document.getElementById("f-rencana-topik").oninput = function(e){ m.rencana.topik = e.target.value; };
  document.getElementById("f-rencana-catatan").oninput = function(e){ m.rencana.catatan = e.target.value; autoGrow(e.target); };
  autoGrow(document.getElementById("f-rencana-catatan"));

  document.getElementById("btn-regen-nomor").onclick = function(){ m.nomor = generateNomor(m.tanggal, m.id); render(); };

  document.getElementById("f-pimpinan").onchange = function(e){
    if(e.target.value === "__add__"){
      var v = prompt("Nama pimpinan rapat (di luar daftar staff):");
      if(v && v.trim()){ m.pimpinan = v.trim(); render(); } else { e.target.value = m.pimpinan; }
    } else { m.pimpinan = e.target.value; }
  };
  document.getElementById("f-notulen").onchange = function(e){
    if(e.target.value === "__add__"){
      var v = prompt("Nama notulen (di luar daftar staff):");
      if(v && v.trim()){ m.notulen = v.trim(); render(); } else { e.target.value = m.notulen; }
    } else { m.notulen = e.target.value; }
  };

  var pesertaInput = document.getElementById("peserta-input");
  pesertaInput.onkeydown = function(e){
    if(e.key === "Enter" || e.key === ","){
      e.preventDefault();
      var v = pesertaInput.value.trim().replace(/,$/,"");
      if(v){ m.peserta = m.peserta || []; m.peserta.push(v); render(); var el=document.getElementById("peserta-input"); if(el) el.focus(); }
    }
  };
  document.querySelectorAll(".btn-remove-peserta").forEach(function(b){ b.onclick = function(){ var idx=parseInt(b.getAttribute("data-idx"),10); m.peserta.splice(idx,1); render(); }; });
  document.querySelectorAll(".btn-suggest-peserta").forEach(function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-val");
      m.peserta = m.peserta || [];
      if(m.peserta.indexOf(v) === -1) m.peserta.push(v);
      render();
    };
  });

  var topikInput = document.getElementById("topik-input");
  function addTopik(v){
    v = v.trim().replace(/,$/,"");
    if(!v) return;
    m.topik = m.topik || [];
    if(m.topik.indexOf(v) === -1) m.topik.push(v);
    if(state.settings.topikSuggestions.indexOf(v) === -1){ state.settings.topikSuggestions.push(v); saveSettingsRow(); }
    render();
    var el = document.getElementById("topik-input");
    if(el) el.focus();
  }
  topikInput.onkeydown = function(e){ if(e.key === "Enter" || e.key === ","){ e.preventDefault(); addTopik(topikInput.value); } };
  document.querySelectorAll(".btn-remove-topik").forEach(function(b){ b.onclick = function(){ var idx=parseInt(b.getAttribute("data-idx"),10); m.topik.splice(idx,1); render(); }; });
  document.querySelectorAll(".btn-suggest-topik").forEach(function(b){ b.onclick = function(){ addTopik(b.getAttribute("data-val")); }; });

  document.getElementById("btn-add-metric").onclick = function(){
    m.metrics = m.metrics || [];
    m.metrics.push({ id: uid(), staff: "", rows: [{ id: uid(), indikator: "", target: "", progress: "", hasil: "", status: "proses", catatan: "" }] });
    render();
    var lastIdx = m.metrics.length - 1;
    var first = document.querySelector('.metric-staff[data-gidx="' + lastIdx + '"]');
    if(first) first.focus();
  };
  document.querySelectorAll(".metric-staff").forEach(function(sel){
    sel.onchange = function(e){
      var gIdx = parseInt(sel.getAttribute("data-gidx"),10);
      if(e.target.value === "__add__"){
        var v = prompt("Nama (di luar daftar staff):");
        if(v && v.trim()){ m.metrics[gIdx].staff = v.trim(); render(); } else { e.target.value = m.metrics[gIdx].staff || ""; }
      } else { m.metrics[gIdx].staff = e.target.value; }
    };
  });
  document.querySelectorAll(".btn-del-metric-group").forEach(function(b){
    b.onclick = function(){
      var gIdx = parseInt(b.getAttribute("data-gidx"),10);
      if(m.metrics[gIdx].rows && m.metrics[gIdx].rows.length > 0){
        if(!confirm("Hapus semua data kinerja untuk orang ini?")) return;
      }
      m.metrics.splice(gIdx,1);
      render();
    };
  });
  document.querySelectorAll(".add-metric-row-btn").forEach(function(b){
    b.onclick = function(){
      var gIdx = parseInt(b.getAttribute("data-gidx"),10);
      m.metrics[gIdx].rows = m.metrics[gIdx].rows || [];
      m.metrics[gIdx].rows.push({ id: uid(), indikator: "", target: "", progress: "", hasil: "", status: "proses", catatan: "" });
      render();
      var lastIdx = m.metrics[gIdx].rows.length - 1;
      var first = document.querySelector('.metric-indikator[data-gidx="' + gIdx + '"][data-ridx="' + lastIdx + '"]');
      if(first) first.focus();
    };
  });
  document.querySelectorAll(".metric-indikator").forEach(function(inp){
    inp.oninput = function(e){ var g=parseInt(inp.getAttribute("data-gidx"),10), r=parseInt(inp.getAttribute("data-ridx"),10); m.metrics[g].rows[r].indikator = e.target.value; };
    inp.onblur = function(e){
      var v = e.target.value.trim();
      if(v && state.settings.indikatorSuggestions.indexOf(v) === -1){ state.settings.indikatorSuggestions.push(v); saveSettingsRow(); }
    };
  });
  document.querySelectorAll(".metric-target").forEach(function(inp){ inp.oninput = function(e){ var g=parseInt(inp.getAttribute("data-gidx"),10), r=parseInt(inp.getAttribute("data-ridx"),10); m.metrics[g].rows[r].target = e.target.value; }; });
  document.querySelectorAll(".metric-progress").forEach(function(inp){ inp.oninput = function(e){ var g=parseInt(inp.getAttribute("data-gidx"),10), r=parseInt(inp.getAttribute("data-ridx"),10); m.metrics[g].rows[r].progress = e.target.value; }; });
  document.querySelectorAll(".metric-hasil").forEach(function(inp){ inp.oninput = function(e){ var g=parseInt(inp.getAttribute("data-gidx"),10), r=parseInt(inp.getAttribute("data-ridx"),10); m.metrics[g].rows[r].hasil = e.target.value; }; });
  document.querySelectorAll(".metric-status").forEach(function(sel){ sel.onchange = function(e){ var g=parseInt(sel.getAttribute("data-gidx"),10), r=parseInt(sel.getAttribute("data-ridx"),10); m.metrics[g].rows[r].status = e.target.value; }; });
  document.querySelectorAll(".metric-catatan").forEach(function(inp){ inp.oninput = function(e){ var g=parseInt(inp.getAttribute("data-gidx"),10), r=parseInt(inp.getAttribute("data-ridx"),10); m.metrics[g].rows[r].catatan = e.target.value; }; });
  document.querySelectorAll(".btn-del-metric-row").forEach(function(b){
    b.onclick = function(){ var g=parseInt(b.getAttribute("data-gidx"),10), r=parseInt(b.getAttribute("data-ridx"),10); m.metrics[g].rows.splice(r,1); render(); };
  });

  document.getElementById("btn-add-block").onclick = function(){
    m.blocks = m.blocks || [];
    m.blocks.unshift({ id: uid(), judul: "", isi: "", timestamp: new Date().toISOString() });
    render();
    var first = document.querySelector('.block-judul-input[data-idx="0"]');
    if(first) first.focus();
  };
  document.querySelectorAll(".block-judul-input").forEach(function(inp){ inp.oninput = function(e){ var idx=parseInt(inp.getAttribute("data-idx"),10); m.blocks[idx].judul = e.target.value; }; });
  document.querySelectorAll(".block-isi").forEach(function(div){ div.oninput = function(e){ var idx=parseInt(div.getAttribute("data-idx"),10); m.blocks[idx].isi = div.innerHTML; }; });
  document.querySelectorAll(".rt-btn").forEach(function(btn){
    btn.addEventListener("mousedown", function(e){ e.preventDefault(); });
    btn.addEventListener("click", function(){
      var idx = btn.getAttribute("data-idx");
      var target = document.querySelector('.block-isi[data-idx="' + idx + '"]');
      if(!target) return;
      target.focus();
      document.execCommand(btn.getAttribute("data-cmd"), false, null);
      m.blocks[parseInt(idx,10)].isi = target.innerHTML;
    });
  });
  document.querySelectorAll(".btn-del-block").forEach(function(b){
    b.onclick = function(){ var idx=parseInt(b.getAttribute("data-idx"),10); if(!confirm("Hapus kolom ini?")) return; m.blocks.splice(idx,1); render(); };
  });

  document.getElementById("btn-add-ide").onclick = function(){
    m.ide = m.ide || [];
    m.ide.unshift({ id: uid(), judul: "", deskripsi: "", pic: "", timestamp: new Date().toISOString() });
    render();
    var first = document.querySelector('.ide-judul-input[data-idx="0"]');
    if(first) first.focus();
  };
  document.querySelectorAll(".ide-judul-input").forEach(function(inp){ inp.oninput = function(e){ var idx=parseInt(inp.getAttribute("data-idx"),10); m.ide[idx].judul = e.target.value; }; });
  document.querySelectorAll(".ide-deskripsi").forEach(function(ta){ ta.oninput = function(e){ var idx=parseInt(ta.getAttribute("data-idx"),10); m.ide[idx].deskripsi = e.target.value; autoGrow(ta); }; autoGrow(ta); });
  document.querySelectorAll(".ide-pic").forEach(function(sel){
    sel.onchange = function(e){
      var idx = parseInt(sel.getAttribute("data-idx"),10);
      if(e.target.value === "__add__"){
        var v = prompt("Nama (di luar daftar staff):");
        if(v && v.trim()){ m.ide[idx].pic = v.trim(); render(); } else { e.target.value = m.ide[idx].pic || ""; }
      } else { m.ide[idx].pic = e.target.value; }
    };
  });
  document.querySelectorAll(".btn-del-ide").forEach(function(b){
    b.onclick = function(){ var idx=parseInt(b.getAttribute("data-idx"),10); if(!confirm("Hapus ide ini?")) return; m.ide.splice(idx,1); render(); };
  });

  document.getElementById("btn-add-todo").onclick = function(){
    m.todos = m.todos || [];
    m.todos.unshift({ id: uid(), judul: "", deskripsi: "", pic: "", tenggat: "", status: "belum", timestamp: new Date().toISOString() });
    render();
    var first = document.querySelector('.todo-judul-input[data-idx="0"]');
    if(first) first.focus();
  };
  document.querySelectorAll(".todo-judul-input").forEach(function(inp){ inp.oninput = function(e){ var idx=parseInt(inp.getAttribute("data-idx"),10); m.todos[idx].judul = e.target.value; }; });
  document.querySelectorAll(".todo-deskripsi").forEach(function(ta){ ta.oninput = function(e){ var idx=parseInt(ta.getAttribute("data-idx"),10); m.todos[idx].deskripsi = e.target.value; autoGrow(ta); }; autoGrow(ta); });
  document.querySelectorAll(".todo-pic").forEach(function(sel){
    sel.onchange = function(e){
      var idx = parseInt(sel.getAttribute("data-idx"),10);
      if(e.target.value === "__add__"){
        var v = prompt("Nama (di luar daftar staff):");
        if(v && v.trim()){ m.todos[idx].pic = v.trim(); render(); } else { e.target.value = m.todos[idx].pic || ""; }
      } else { m.todos[idx].pic = e.target.value; }
    };
  });
  document.querySelectorAll(".todo-tenggat").forEach(function(inp){ inp.onchange = function(e){ var idx=parseInt(inp.getAttribute("data-idx"),10); m.todos[idx].tenggat = e.target.value; }; });
  document.querySelectorAll(".todo-status").forEach(function(sel){ sel.onchange = function(e){ var idx=parseInt(sel.getAttribute("data-idx"),10); m.todos[idx].status = e.target.value; }; });
  document.querySelectorAll(".btn-del-todo").forEach(function(b){
    b.onclick = function(){ var idx=parseInt(b.getAttribute("data-idx"),10); if(!confirm("Hapus todo ini?")) return; m.todos.splice(idx,1); render(); };
  });
}

function printMeeting(id){
  var m = state.meetings.find(function(x){return x.id===id;}) || (state.editing && state.editing.id===id ? state.editing : null);
  if(!m){ alert("Simpan rapat terlebih dahulu sebelum mencetak."); return; }

  var pesertaText = (m.peserta && m.peserta.length) ? m.peserta.join(", ") : "-";
  var topikText = (m.topik && m.topik.length) ? m.topik.join(", ") : "-";

  var metricsHtmlPrint = "";
  if(m.metrics && m.metrics.length){
    var groupsHtml = m.metrics.filter(function(g){ return g.rows && g.rows.length; }).map(function(g){
      var headRow = '<tr><th>Indikator</th><th>Target</th><th>Progress</th><th>Hasil</th><th>Status</th><th>Catatan</th></tr>';
      var rowsHtml = g.rows.map(function(r){
        return '<tr>' +
          '<td>' + esc(r.indikator || "-") + '</td>' +
          '<td>' + esc(r.target!==""&&r.target!=null?String(r.target):"-") + '</td>' +
          '<td style="font-weight:700;">' + esc(r.progress!==""&&r.progress!=null?String(r.progress):"-") + '</td>' +
          '<td>' + esc(r.hasil||"-") + '</td>' +
          '<td>' + esc(STATUS_KINERJA_LABEL[r.status] || "-") + '</td>' +
          '<td style="color:#666;">' + esc(r.catatan||"") + '</td>' +
        '</tr>';
      }).join("");
      return '<div style="margin-bottom:14px;"><div style="font-weight:700;font-size:12.5px;margin-bottom:4px;">' + esc(g.staff || "(Tanpa nama)") + '</div><table class="doc-table">' + headRow + rowsHtml + '</table></div>';
    }).join("");
    metricsHtmlPrint = groupsHtml ? '<div class="doc-section-h">1. Laporan / Data Kinerja</div>' + groupsHtml : "";
  }

  var blocksHtmlPrint = "";
  if(m.blocks && m.blocks.length){
    blocksHtmlPrint = '<div class="doc-section-h">2. Isi Rapat</div>' + m.blocks.slice().reverse().map(function(b, i){
      var judul = b.judul ? esc(b.judul) : ("Poin " + (i+1));
      return '<div class="doc-block"><div class="doc-block-head"><span>' + judul + '</span></div><div class="doc-block-body">' + (toDisplayHtml(b.isi) || "-") + '</div><div class="doc-block-time">Dicatat: ' + esc(formatTimestamp(b.timestamp)) + '</div></div>';
    }).join("");
  }

  var ideHtmlPrint = "";
  if(m.ide && m.ide.length){
    var ideRows = m.ide.slice().reverse().map(function(g){
      return '<tr><td style="font-weight:700;">' + esc(g.judul||"-") + '</td><td>' + esc(g.pic||"-") + '</td><td>' + esc(g.deskripsi||"-") + '</td></tr>';
    }).join("");
    ideHtmlPrint = '<div class="doc-section-h">3. Ide</div><table class="doc-table"><tr><th>Judul</th><th>Diusulkan Oleh</th><th>Deskripsi</th></tr>' + ideRows + '</table>';
  }

  var todoHtmlPrint = "";
  if(m.todos && m.todos.length){
    var todoRows = m.todos.slice().reverse().map(function(t){
      return '<tr><td style="font-weight:700;">' + esc(t.judul||"-") + '</td><td>' + esc(t.pic||"-") + '</td><td>' + esc(t.tenggat?formatTanggalPendek(t.tenggat):"-") + '</td><td>' + esc(STATUS_TODO_LABEL[t.status]||"-") + '</td><td>' + esc(t.deskripsi||"-") + '</td></tr>';
    }).join("");
    todoHtmlPrint = '<div class="doc-section-h">4. Todo</div><table class="doc-table"><tr><th>Judul</th><th>PIC</th><th>Tenggat</th><th>Status</th><th>Deskripsi</th></tr>' + todoRows + '</table>';
  }

  var rencanaHtml = "";
  if(m.rencana && (m.rencana.tanggal || m.rencana.topik || m.rencana.catatan)){
    rencanaHtml = '<div class="doc-section-h">Rencana Rapat Berikutnya</div><div class="doc-next">' +
      (m.rencana.tanggal ? '<strong>Tanggal:</strong> ' + esc(formatTanggalPanjang(m.rencana.tanggal)) + '<br>' : '') +
      (m.rencana.topik ? '<strong>Topik:</strong> ' + esc(m.rencana.topik) + '<br>' : '') +
      (m.rencana.catatan ? '<strong>Catatan:</strong> ' + esc(m.rencana.catatan) : '') +
    '</div>';
  }

  var html = '<div class="doc-page">' +
    '<div class="doc-header-logo"><img src="' + LOGO_DATA_URI + '" alt="Logo Assyifa Tour and Travel"></div>' +
    '<div class="doc-title">Risalah Rapat</div>' +
    '<div class="doc-subtitle">Assyifa Tour and Travel &mdash; ' + esc(m.jenisRapat) + '</div>' +
    '<table class="doc-meta-table">' +
      '<tr><td class="k">Nomor</td><td class="sep">:</td><td>' + esc(m.nomor) + '</td></tr>' +
      '<tr><td class="k">Hari, Tanggal</td><td class="sep">:</td><td>' + esc(formatTanggalPanjang(m.tanggal)) + '</td></tr>' +
      '<tr><td class="k">Topik</td><td class="sep">:</td><td>' + esc(topikText) + '</td></tr>' +
      (m.keterangan ? '<tr><td class="k">Keterangan</td><td class="sep">:</td><td>' + esc(m.keterangan) + '</td></tr>' : '') +
      '<tr><td class="k">Pimpinan Rapat</td><td class="sep">:</td><td>' + esc(m.pimpinan || "-") + '</td></tr>' +
      '<tr><td class="k">Notulen</td><td class="sep">:</td><td>' + esc(m.notulen || "-") + '</td></tr>' +
      '<tr><td class="k">Peserta</td><td class="sep">:</td><td>' + esc(pesertaText) + '</td></tr>' +
    '</table>' +
    metricsHtmlPrint +
    blocksHtmlPrint +
    ideHtmlPrint +
    todoHtmlPrint +
    rencanaHtml +
    '<div class="doc-sign"><div class="doc-sign-block">Mengetahui,<br>Pimpinan Rapat<div class="doc-sign-space"></div><strong>' + esc(m.pimpinan || "________________") + '</strong></div><div class="doc-sign-block">Notulen<div class="doc-sign-space"></div><strong>' + esc(m.notulen || "________________") + '</strong></div></div>' +
    '<div class="doc-footer-note">Dicetak ' + esc(formatTimestamp(new Date().toISOString())) + '</div>' +
  '</div>';

  document.getElementById("print-area").innerHTML = html;
  setTimeout(function(){ window.print(); }, 50);
}

loadData();
})();
</script>
